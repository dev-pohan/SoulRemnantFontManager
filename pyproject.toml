[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "soul-remnant-font-manager"
version = "0.3.4"
description = "Cross-platform prelaunch font manager for Soul's Remnant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Soul's Remnant community" }]
dependencies = []

[project.scripts]
srfontmanager = "srfontmanager.app:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
